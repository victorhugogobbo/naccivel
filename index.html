<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#082542">
  <title>NAC Cível | Central de Acesso</title>
  <link rel="icon" type="image/png" href="https://i.ibb.co/kCn7RW1/simbolo.png">
  <style>
    * { box-sizing: border-box; }
    body { margin:0; min-height:100vh; display:flex; flex-direction:column; background:#f5f7fa; color:#172033; font-family:Arial,Helvetica,sans-serif; }
    .topo { width:calc(100% - 36px); max-width:900px; margin:16px auto 0; border-radius:10px; overflow:hidden; border-bottom:5px solid #d7b14a; background:#fff; line-height:0; box-shadow:0 2px 8px rgba(8,37,66,.15); }
    .topo img { display:block; width:100%; height:auto; }
    main { flex:1; width:100%; max-width:900px; margin:0 auto; padding:22px 18px 10px; }
    h2 { margin:22px 0 10px; font-size:12px; color:#8a6918; letter-spacing:.8px; text-transform:uppercase; }
    .grade { display:grid; grid-template-columns:1fr 1fr; gap:10px; }
    .grade .acao { min-height:88px; }
    .grade .acao.compacto { min-height:0; padding-top:13px; padding-bottom:13px; }
    @media (max-width:640px){ .grade { grid-template-columns:1fr; } }
    body.modo-central { overflow:hidden; }
    iframe.central { position:fixed; top:0; left:0; width:100%; height:100%; border:0; background:#f5f7fa; z-index:10; }
    .voltar { display:inline-block; margin:0 0 4px; font-size:13px; color:#082542; text-decoration:none; font-weight:bold; }
    .voltar:hover { text-decoration:underline; }
    .vazio { grid-column:1/-1; color:#667085; font-size:14px; padding:18px 2px; }
    .acao.bloqueado { cursor:not-allowed; background:#f1f4f8; border-style:dashed; color:#667085; }
    .acao.bloqueado:hover { background:#f1f4f8; border-color:#d9e0ea; }
    .acao.bloqueado::after { content:none; }
    .selo { font-style:normal; position:absolute; right:16px; top:14px; background:#fff4d6; color:#8a6918; border:1px solid #ecd48a; border-radius:999px; padding:3px 10px; font-size:11px; font-weight:bold; }
    .acao.externo::after { content:"\2197"; font-size:18px; }
    .acao { display:block; position:relative; border:1px solid #d9e0ea; background:#fff; border-radius:9px; padding:16px 46px 16px 18px; color:#082542; font-weight:bold; font-size:15px; text-decoration:none; }
    .acao:hover, .acao:focus { background:#f5f8fc; border-color:#aebdcd; outline:none; }
    .acao span { display:block; margin-top:5px; font-weight:normal; font-size:12px; line-height:1.4; color:#667085; }
    .acao::after { content:"\203A"; position:absolute; right:18px; top:50%; transform:translateY(-50%); font-size:26px; font-weight:normal; color:#aebdcd; }
    .aviso { margin:14px 2px 0; font-size:12px; line-height:1.5; color:#667085; }
    .rodape { width:100%; max-width:900px; margin:28px auto 0; padding:14px 18px 22px; border-top:3px solid #d7b14a; text-align:center; color:#667085; font-size:12px; line-height:1.6; }
  </style>

  <div class="rodape">
    <div>Diretoria Judiciária - Núcleo de Apoio ao Cumprimento de Atos · 1º e 2º Grau</div>
    <div>Central NAC Cível - www.naccivel.com.br</div>

<script>
/* =====================================================================
   ONDE EDITAR: só esta parte. Manuais, orientações e fluxogramas vêm das pastas do Drive (script
   Fluxogramas.gs): para mudar um arquivo, mexa na pasta, não aqui. Aqui ficam só os links fixos e
   o link do script.
   ===================================================================== */
var LINK_CENTRAL = 'https://script.google.com/macros/s/AKfycbzI-iDaYAhLxIMtjbozqYYp6d3R3puS7gGh9b7_hIiFtPzruc217pZT5lQbA5w_HPCL_A/exec?p=central';
var LINK_PROJUDI = 'https://projudi.tjgo.jus.br/';

// Endereço do script que lê as pastas do Drive (fluxogramas e orientações; arquivo Fluxogramas.gs,
// publicado como aplicativo da Web, acesso "Qualquer pessoa"). Link que termina em /exec.
var URL_FLUXOGRAMAS = 'https://script.google.com/macros/s/AKfycbyEeCK6wXPJUv1fuaPEZyhdg5MvB4uUQzjp9VH7_lZYPZrmuOFsdnRDEUNFvlQlXCbRnw/exec';

/* ===================================================================== */

function esc(t) { return String(t).replace(/[&<>"]/g, function(c) { return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]; }); }

function cartao(nome, desc, href, opcoes) {
  opcoes = opcoes || {};
  var alvo = opcoes.novaAba ? ' target="_blank" rel="noopener noreferrer"' : '';
  var cls = 'acao' + (opcoes.novaAba ? ' externo' : '') + (opcoes.compacto ? ' compacto' : '');
  return '<a class="' + cls + '" href="' + esc(href) + '"' + alvo + '>' + esc(nome) +
    (desc ? '<span>' + esc(desc) + '</span>' : '') + '</a>';
}

function pagina(titulo, voltarPara, voltarTexto, cartoes) {
  var h = '';
  if (voltarPara) h += '<a class="voltar" href="' + voltarPara + '">‹ ' + esc(voltarTexto) + '</a>';
  h += '<h2>' + esc(titulo) + '</h2><div class="grade">' + (cartoes || '<div class="vazio">Nada cadastrado ainda.</div>') + '</div>';
  return h;
}

// ---- lista de fluxogramas vinda da pasta do Drive (JSONP, para funcionar em qualquer hospedagem) ----
var LISTA_FLUX = null;      // { civel: [ {nome, url} ], fazendas: [...] }
var ESTADO_FLUX = '';       // '', 'carregando', 'erro'

function carregarFluxogramas() {
  if (ESTADO_FLUX === 'carregando') return;
  ESTADO_FLUX = 'carregando';
  var nome = 'fluxCb' + Date.now();
  var tag = document.createElement('script');
  var fim = function(ok, dados) {
    clearTimeout(tempo);
    delete window[nome];
    if (tag.parentNode) tag.parentNode.removeChild(tag);
    if (ok) { LISTA_FLUX = dados; ESTADO_FLUX = ''; } else { ESTADO_FLUX = 'erro'; }
    desenhar();
  };
  var tempo = setTimeout(function() { fim(false); }, 20000);
  window[nome] = function(dados) { fim(!!dados && !dados.erro, dados); };
  tag.onerror = function() { fim(false); };
  tag.src = URL_FLUXOGRAMAS + (URL_FLUXOGRAMAS.indexOf('?') < 0 ? '?' : '&') + 'callback=' + nome;
  document.head.appendChild(tag);
}

// Nome da área de fluxograma (vem do Drive; antes de carregar, só "Fluxogramas").
function tituloArea(chave) {
  var areas = (LISTA_FLUX && LISTA_FLUX._areas) || [];
  for (var i = 0; i < areas.length; i++) { if (areas[i].chave === chave) return 'Fluxogramas · ' + areas[i].titulo; }
  return 'Fluxogramas';
}

// Menu de fluxogramas: um botão por pasta que existe no Drive.
function cartoesAreas() {
  return ((LISTA_FLUX && LISTA_FLUX._areas) || []).map(function(a) { return cartao(a.titulo, '', '#/fluxogramas/' + a.chave); }).join('');
}

// Página cuja lista vem da pasta do Drive. chave = nome da lista devolvida pelo script.
function paginaDrive(titulo, chave, voltar, textoVoltar) {
  if (!URL_FLUXOGRAMAS) return pagina(titulo, voltar, textoVoltar, '<div class="vazio">Lista ainda não configurada.</div>');
  if (LISTA_FLUX) return pagina(titulo, voltar, textoVoltar, chave === '_areas' ? cartoesAreas() : listaLinks(LISTA_FLUX[chave] || []));
  if (ESTADO_FLUX === 'erro') {
    return pagina(titulo, voltar, textoVoltar,
      '<div class="vazio">Não foi possível carregar a lista agora. <a href="' + location.hash + '" onclick="ESTADO_FLUX=\'\';desenhar();return false;">Tentar novamente</a></div>');
  }
  carregarFluxogramas();
  return pagina(titulo, voltar, textoVoltar, '<div class="vazio">Carregando...</div>');
}

function listaLinks(itens) {
  return itens.map(function(i) { return cartao(i.nome, '', i.url, { novaAba: true }); }).join('');
}

// A Central abre dentro do próprio portal (tela inteira), para o endereço naccivel.com.br não mudar.
// Firefox, Safari e celulares/tablets bloqueiam os cookies do Google dentro de moldura (erro 401): nesses abre direto.
function abrirCentral() {
  var ua = navigator.userAgent;
  var chromium = /Chrome|Chromium|CriOS|Edg\//.test(ua) && !/FxiOS|Firefox/.test(ua);
  if (!chromium || /iPhone|iPad|iPod|Android|Mobile/i.test(ua)) { location.replace(LINK_CENTRAL); return; }
  document.body.classList.add('modo-central');
  document.getElementById('tela').innerHTML = '<iframe class="central" src="' + esc(LINK_CENTRAL) + '" title="Central NAC Cível" allow="clipboard-write; clipboard-read"></iframe>';
}

function desenhar() {
  var rota = (location.hash || '').replace(/^#\/?/, '');
  var partes = rota.split('/');
  var h;

  document.body.classList.remove('modo-central');

  if (partes[0] === 'central') { abrirCentral(); return; }

  if (partes[0] === 'manuais') {
    h = paginaDrive('Manuais', 'manuais', '#/', 'Voltar ao portal');
  } else if (partes[0] === 'orientacoes') {
    h = paginaDrive('Orientações', 'orientacoes', '#/', 'Voltar ao portal');
  } else if (partes[0] === 'fluxogramas' && partes[1]) {
    h = paginaDrive(tituloArea(partes[1]), partes[1], '#/fluxogramas', 'Voltar aos fluxogramas');
  } else if (partes[0] === 'fluxogramas') {
    h = paginaDrive('Fluxogramas', '_areas', '#/', 'Voltar ao portal');
  } else {
    h = pagina('Portal de acesso', '', '',
      cartao('Acessar Central NAC Cível', 'Central de trabalho e recursos operacionais em apoio ao Núcleo.', '#/central') +
      cartao('Acessar PROJUDI', '', LINK_PROJUDI, { novaAba: true })) +
      pagina('Material de apoio', '', '',
      cartao('Acessar manuais', 'Manuais de procedimentos de trabalho.', '#/manuais') +
      cartao('Acessar orientações', 'Orientações de procedimentos de trabalho.', '#/orientacoes') +
      cartao('Acessar fluxogramas', 'Fluxogramas de procedimentos processuais.', '#/fluxogramas'));
  }

  document.getElementById('tela').innerHTML = h;
  window.scrollTo(0, 0);
}

window.addEventListener('hashchange', desenhar);
// "Voltar ao portal" dentro da Central (que abre em moldura aqui): ela avisa e a página volta ao início.
window.addEventListener('message', function(e) { if (e.data === 'nac-voltar-portal') { location.hash = '#/'; } });
desenhar();
</script>
