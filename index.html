<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Central NAC Cível</title>
  <link rel="icon" href="https://drive.google.com/uc?export=view&id=1B5gjXXsyQcAstTN-el0CDXJji6NTLeTH&type=.png">
  <style>
    html, body { margin: 0; height: 100%; overflow: hidden; background: #f5f7fa; }
    iframe { display: block; width: 100%; height: 100%; border: 0; }
  </style>
</head>
<body>
  <iframe id="central" title="Central NAC Cível" allow="clipboard-write"></iframe>
  <script>
    // Endereço do aplicativo da web (Apps Script).
    var APP = 'https://script.google.com/macros/s/AKfycbzI-iDaYAhLxIMtjbozqYYp6d3R3puS7gGh9b7_hIiFtPzruc217pZT5lQbA5w_HPCL_A/exec';

    // naccivel.com.br/?p=aovivo abre direto o Painel ao vivo; sem nada, abre a Central.
    var p = new URLSearchParams(location.search).get('p') || 'central';
    var destino = APP + '?p=' + encodeURIComponent(p);

    // iPhone/iPad (qualquer navegador) e Safari do Mac bloqueiam o login do Google dentro do quadro (erro 401).
    // Nesses aparelhos, abre a Central direto, sem quadro.
    var ua = navigator.userAgent;
    var ehIOS = /iPhone|iPad|iPod/i.test(ua) || (/Macintosh/i.test(ua) && navigator.maxTouchPoints > 1);
    var ehSafariMac = /Safari/i.test(ua) && !/Chrome|Chromium|CriOS|FxiOS|Edg|OPR|Android/i.test(ua);

    if (ehIOS || ehSafariMac) {
      location.replace(destino);
    } else {
      document.getElementById('central').src = destino;
    }
  </script>
</body>
</html>
